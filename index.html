<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>捷徑觸發器</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap');

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #222222;
      --accent: #e8ff47;
      --accent2: #ff4757;
      --accent3: #47d4ff;
      --text: #f0f0f0;
      --muted: #555;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      overflow-x: hidden;
    }

    /* background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(232,255,71,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(232,255,71,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
    }

    header {
      margin-bottom: 2.5rem;
      text-align: left;
    }

    .label {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      line-height: 1.1;
      color: var(--text);
    }

    h1 span {
      color: var(--accent);
    }

    .subtitle {
      margin-top: 0.75rem;
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.6;
    }

    /* status */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
      padding: 0.6rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.7rem;
      color: var(--muted);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* buttons */
    .btn-grid {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .btn {
      position: relative;
      width: 100%;
      padding: 1.1rem 1.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .btn::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--accent);
      transform: scaleY(0);
      transform-origin: bottom;
      transition: transform 0.2s ease;
    }

    .btn:hover {
      border-color: var(--accent);
      background: #161616;
      transform: translateX(2px);
    }

    .btn:hover::before {
      transform: scaleY(1);
    }

    .btn:active {
      transform: translateX(2px) scale(0.99);
    }

    .btn.red::before { background: var(--accent2); }
    .btn.red:hover { border-color: var(--accent2); }

    .btn.blue::before { background: var(--accent3); }
    .btn.blue:hover { border-color: var(--accent3); }

    .btn-info {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .btn-name {
      font-weight: 700;
      font-size: 0.85rem;
    }

    .btn-desc {
      font-size: 0.65rem;
      color: var(--muted);
    }

    .btn-icon {
      font-size: 1.2rem;
      flex-shrink: 0;
      opacity: 0.6;
    }

    /* toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--accent);
      color: #000;
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.75rem 1.5rem;
      border-radius: 4px;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      white-space: nowrap;
      z-index: 100;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .toast.red {
      background: var(--accent2);
      color: #fff;
    }

    .toast.blue {
      background: var(--accent3);
      color: #000;
    }

    footer {
      margin-top: 2.5rem;
      font-size: 0.65rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.8;
    }

    footer code {
      color: var(--accent);
      font-family: 'Space Mono', monospace;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="label">// 捷徑觸發器 v1.0</div>
    <h1>Shortcut<br><span>Trigger</span></h1>
    <p class="subtitle">點擊按鈕直接觸發 iOS 捷徑<br>需在 iPhone Safari 中開啟</p>
  </header>

  <div class="status-bar">
    <div class="dot"></div>
    <span>已就緒 — 等待觸發指令</span>
  </div>

  <div class="btn-grid">

    <button class="btn" onclick="trigger('測試捷徑觸發', 'yellow')">
      <div class="btn-info">
        <div class="btn-name">觸發捷徑</div>
        <div class="btn-desc">執行「測試捷徑觸發」</div>
      </div>
      <div class="btn-icon">⚡</div>
    </button>

    <button class="btn" onclick="trigger('測試捷徑觸發', 'yellow')">
      <div class="btn-info">
        <div class="btn-name">觸發捷徑（附輸入）</div>
        <div class="btn-desc">帶入參數「hello」執行</div>
      </div>
      <div class="btn-icon">📥</div>
    </button>

    <button class="btn red" onclick="triggerWithInput('測試捷徑觸發', prompt('輸入參數：'), 'red')">
      <div class="btn-info">
        <div class="btn-name">自訂參數觸發</div>
        <div class="btn-desc">手動輸入參數後執行</div>
      </div>
      <div class="btn-icon">✏️</div>
    </button>

    <button class="btn blue" onclick="triggerWithInput('測試捷徑觸發', 'hello', 'blue')">
      <div class="btn-info">
        <div class="btn-name">帶參數觸發</div>
        <div class="btn-desc">帶入「hello」執行捷徑</div>
      </div>
      <div class="btn-icon">🔵</div>
    </button>

  </div>

  <footer>
    捷徑名稱：<code>測試捷徑觸發</code><br>
    使用 <code>shortcuts://run-shortcut</code> URL Scheme
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
  function showToast(msg, color = 'yellow') {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'toast';
    if (color === 'red') toast.classList.add('red');
    if (color === 'blue') toast.classList.add('blue');
    requestAnimationFrame(() => {
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    });
  }

  function trigger(name, color = 'yellow') {
    const url = `shortcuts://run-shortcut?name=${encodeURIComponent(name)}`;
    showToast(`⚡ 觸發中：${name}`, color);
    setTimeout(() => { window.location.href = url; }, 300);
  }

  function triggerWithInput(name, input, color = 'yellow') {
    if (!input) return;
    const url = `shortcuts://run-shortcut?name=${encodeURIComponent(name)}&input=${encodeURIComponent(input)}`;
    showToast(`⚡ 觸發中：${name}`, color);
    setTimeout(() => { window.location.href = url; }, 300);
  }
</script>

</body>
</html>
