<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>iPhone</title>
  <style>
    :root {
      --wallpaper: url('images/wallpaper.jpg');
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
      background: #000;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* phone frame — centered on desktop, full-bleed on mobile */
    .phone {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 100vh;
      max-height: 932px;
      margin: 0 auto;
      overflow: hidden;
      background: #000;
      border-radius: 0;
    }
    @media (min-width: 460px) {
      body { display: flex; align-items: center; justify-content: center; }
      .phone {
        height: 90vh;
        border-radius: 48px;
        box-shadow: 0 0 0 12px #1a1a1a, 0 20px 60px rgba(0,0,0,0.6);
      }
    }

    /* shared screen base */
    .screen {
      position: absolute;
      inset: 0;
      background-image: var(--wallpaper);
      background-size: cover;
      background-position: center;
      color: #fff;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s ease;
      will-change: transform, opacity;
    }

    /* ---------- status bar ---------- */
    .statusbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px 0;
      font-size: 16px;
      font-weight: 600;
      z-index: 5;
      pointer-events: none;
    }
    .sb-time { letter-spacing: 0.3px; min-width: 54px; }

    /* dynamic island (static visual) with lock + faceid beside it */
    .sb-center {
      display: flex;
      align-items: center;
      gap: 8px;
      transform: translateX(-6px);
    }
    .island {
      width: 92px;
      height: 30px;
      background: #000;
      border-radius: 18px;
    }
    .sb-center svg { width: 16px; height: 16px; opacity: 0.95; }

    .sb-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sb-right svg { display: block; }

    /* ---------- initial lock screen ---------- */
    #initial .clock-wrap {
      position: absolute;
      top: 78px;
      left: 0; right: 0;
      text-align: center;
    }
    #initial .date {
      font-size: 18px;
      font-weight: 600;
      opacity: 0.95;
      margin-bottom: 2px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.25);
    }
    #initial .big-clock {
      font-size: 84px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: -1px;
      text-shadow: 0 2px 14px rgba(0,0,0,0.25);
    }

    .corner-btns {
      position: absolute;
      bottom: 54px;
      left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 38px;
    }
    .corner-btn {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: rgba(0,0,0,0.28);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
    }
    .corner-btn svg { width: 22px; height: 22px; }

    .swipe-hint {
      position: absolute;
      bottom: 14px;
      left: 0; right: 0;
      text-align: center;
    }
    .home-bar {
      width: 134px; height: 5px;
      background: #fff;
      border-radius: 3px;
      margin: 0 auto;
      opacity: 0.9;
    }
    .swipe-text {
      font-size: 12px;
      opacity: 0.7;
      margin-bottom: 14px;
      letter-spacing: 0.4px;
    }

    /* ---------- passcode screen ---------- */
    #passcode {
      transform: translateY(100%);
      opacity: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #passcode.active { transform: translateY(0); opacity: 1; }

    #passcode::before {
      content: '';
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.18);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }
    .passcode-inner {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 96px;
      flex: 1;
    }

    .lock-glyph { margin-bottom: 14px; }
    .lock-glyph svg { width: 26px; height: 26px; }

    .pc-title {
      font-size: 17px;
      font-weight: 500;
      margin-bottom: 22px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    .dots {
      display: flex;
      gap: 22px;
      margin-bottom: 42px;
      height: 14px;
    }
    .dot {
      width: 13px; height: 13px;
      border-radius: 50%;
      border: 1.5px solid #fff;
      background: transparent;
      transition: background 0.15s ease, transform 0.15s ease;
    }
    .dot.filled { background: #fff; transform: scale(1.05); }

    /* shake on (future) wrong attempts / reset */
    .dots.shake { animation: shake 0.4s; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-12px); }
      40% { transform: translateX(12px); }
      60% { transform: translateX(-8px); }
      80% { transform: translateX(8px); }
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px 26px;
      width: 288px;
      margin: 0 auto;
    }
    .key {
      width: 78px; height: 78px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 0.5px solid rgba(255,255,255,0.25);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.12s ease, transform 0.08s ease;
    }
    .key:active { background: rgba(255,255,255,0.45); transform: scale(0.95); }
    .key .num { font-size: 34px; font-weight: 400; line-height: 1; }
    .key .letters {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      margin-top: 3px;
      opacity: 0.95;
    }
    .key .letters.empty { height: 13px; }
    .key.zero { grid-column: 2; }

    .pc-footer {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 22px 44px 22px;
      font-size: 16px;
      font-weight: 400;
    }
    .pc-footer span { cursor: pointer; padding: 6px; }

    /* ---------- home screen ---------- */
    #home {
      transform: scale(1.15);
      opacity: 0;
      pointer-events: none;
    }
    #home.active {
      transform: scale(1);
      opacity: 1;
      pointer-events: auto;
    }
    .app-grid {
      position: absolute;
      top: 86px;
      left: 0; right: 0;
      padding: 0 26px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px 18px;
    }
    .app {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .app img {
      width: 60px; height: 60px;
      border-radius: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: transform 0.12s ease;
    }
    .app:active img { transform: scale(0.9); }
    .app span {
      font-size: 11px;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }

    .dock {
      position: absolute;
      left: 14px; right: 14px;
      bottom: 24px;
      height: 92px;
      border-radius: 34px;
      background: rgba(255,255,255,0.22);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 18px;
    }
    .dock img {
      width: 60px; height: 60px;
      border-radius: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: transform 0.12s ease;
    }
    .dock img:active { transform: scale(0.9); }
  </style>
</head>
<body>

<div class="phone">

  <!-- ============ 0. INITIAL LOCK SCREEN ============ -->
  <section class="screen" id="initial">
    <div class="statusbar"></div>

    <div class="clock-wrap">
      <div class="date" id="date-initial">—</div>
      <div class="big-clock" id="clock-initial">--:--</div>
    </div>

    <div class="corner-btns">
      <div class="corner-btn" aria-label="flashlight">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M9 2h6l-1 6h-4L9 2zm1 8h4v3l-2 11-2-11v-3z"/></svg>
      </div>
      <div class="corner-btn" aria-label="camera">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M3 8h3l2-2h8l2 2h3v11H3V8z"/><circle cx="12" cy="13" r="3.2"/></svg>
      </div>
    </div>

    <div class="swipe-hint">
      <div class="swipe-text">向上滑動以解鎖</div>
      <div class="home-bar"></div>
    </div>
  </section>

  <!-- ============ 1. PASSCODE SCREEN ============ -->
  <section class="screen" id="passcode">
    <div class="statusbar"></div>

    <div class="passcode-inner">
      <div class="lock-glyph">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm3 8H9V6a3 3 0 0 1 6 0v3z"/></svg>
      </div>
      <div class="pc-title">輸入密碼</div>
      <div class="dots" id="dots"></div>
      <div class="keypad" id="keypad"></div>
    </div>

    <div class="pc-footer">
      <span id="emergency">緊急</span>
      <span id="cancel">取消</span>
    </div>
  </section>

  <!-- ============ 2. FAKE HOME SCREEN ============ -->
  <section class="screen" id="home">
    <div class="statusbar"></div>

    <div class="app-grid">
      <div class="app"><img src="images/icon-calculator.png" alt="計算機"><span>計算機</span></div>
      <div class="app"><img src="images/icon-photos.png" alt="照片"><span>照片</span></div>
      <div class="app"><img src="images/icon-setting.png" alt="設定"><span>設定</span></div>
      <div class="app"><img src="images/icon-appstore.png" alt="App Store"><span>App Store</span></div>
    </div>

    <div class="dock">
      <img src="images/icon-photos.png" alt="照片">
      <img src="images/icon-calculator.png" alt="計算機">
      <img src="images/icon-setting.png" alt="設定">
      <img src="images/icon-appstore.png" alt="App Store">
    </div>
  </section>

</div>

<script>
  /* ===== config ===== */
  const PASSCODE_LENGTH = 4; // 未來改密碼長度只改這裡

  /* ===== status bar markup (shared, injected into every screen) ===== */
  const statusBarHTML = `
    <div class="sb-time" data-clock>--:--</div>
    <div class="sb-center">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm3 8H9V6a3 3 0 0 1 6 0v3z"/></svg>
      <div class="island"></div>
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6">
        <path d="M3 8V5a2 2 0 0 1 2-2h3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M21 16v3a2 2 0 0 1-2 2h-3"/>
        <path d="M7 9.5v5M12 8v8M17 9.5v5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="sb-right">
      <!-- cellular -->
      <svg width="18" height="13" viewBox="0 0 18 13" fill="#fff">
        <rect x="0"  y="8"  width="3" height="5"  rx="1"/>
        <rect x="5"  y="5.5" width="3" height="7.5" rx="1"/>
        <rect x="10" y="3"  width="3" height="10" rx="1"/>
        <rect x="15" y="0.5" width="3" height="12.5" rx="1"/>
      </svg>
      <!-- wifi -->
      <svg width="18" height="13" viewBox="0 0 18 13" fill="#fff">
        <path d="M9 2.2c2.9 0 5.6 1.1 7.6 3l-1.5 1.6A8.6 8.6 0 0 0 9 4.3 8.6 8.6 0 0 0 2.9 6.8L1.4 5.2A11 11 0 0 1 9 2.2z"/>
        <path d="M9 6.4c1.7 0 3.3.7 4.5 1.8l-1.6 1.6A4.2 4.2 0 0 0 9 8.5c-1.1 0-2.1.4-2.9 1.3L4.5 8.2A6.4 6.4 0 0 1 9 6.4z"/>
        <circle cx="9" cy="11.4" r="1.5"/>
      </svg>
      <!-- battery -->
      <svg width="27" height="13" viewBox="0 0 27 13" fill="none">
        <rect x="0.5" y="0.5" width="22" height="12" rx="3.5" stroke="#fff" stroke-opacity="0.45"/>
        <rect x="2.5" y="2.5" width="18" height="8" rx="2" fill="#fff"/>
        <path d="M24.5 4.2c1 .3 1 4.3 0 4.6V4.2z" fill="#fff" fill-opacity="0.6"/>
      </svg>
    </div>`;
  document.querySelectorAll('.statusbar').forEach(el => el.innerHTML = statusBarHTML);

  /* ===== live clock + date ===== */
  function pad(n){ return String(n).padStart(2,'0'); }
  function updateClock(){
    const now = new Date();
    const t = pad(now.getHours()) + ':' + pad(now.getMinutes());
    document.querySelectorAll('[data-clock]').forEach(el => el.textContent = t);
    const bc = document.getElementById('clock-initial');
    if (bc) bc.textContent = t;
    const days = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
    const d = document.getElementById('date-initial');
    if (d) d.textContent = `${days[now.getDay()]} ${now.getMonth()+1}月${now.getDate()}日`;
  }
  updateClock();
  setInterval(updateClock, 1000);

  /* ===== build keypad ===== */
  const keys = [
    ['1',''], ['2','ABC'], ['3','DEF'],
    ['4','GHI'], ['5','JKL'], ['6','MNO'],
    ['7','PQRS'], ['8','TUV'], ['9','WXYZ'],
    ['0','']
  ];
  const keypad = document.getElementById('keypad');
  keys.forEach(([num, letters], i) => {
    const k = document.createElement('div');
    k.className = 'key' + (num === '0' ? ' zero' : '');
    k.innerHTML = `<span class="num">${num}</span><span class="letters${letters?'':' empty'}">${letters}</span>`;
    k.addEventListener('click', () => press(num));
    keypad.appendChild(k);
  });

  /* ===== build dots ===== */
  const dotsEl = document.getElementById('dots');
  function renderDots(){
    dotsEl.innerHTML = '';
    for (let i = 0; i < PASSCODE_LENGTH; i++){
      const d = document.createElement('div');
      d.className = 'dot' + (i < input.length ? ' filled' : '');
      dotsEl.appendChild(d);
    }
  }

  /* ===== passcode logic ===== */
  let input = '';
  let locked = false; // prevent input during transition
  renderDots();

  function press(num){
    if (locked || input.length >= PASSCODE_LENGTH) return;
    input += num;
    renderDots();
    if (input.length === PASSCODE_LENGTH){
      locked = true;
      copyToClipboard(input);
      // 不顯示任何文字，短暫延時後清空並進入桌面
      setTimeout(() => {
        input = '';
        renderDots();
        unlock();
      }, 300);
    }
  }

  function clearInput(){
    input = '';
    renderDots();
  }
  document.getElementById('cancel').addEventListener('click', clearInput);

  function copyToClipboard(text){
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  }
  function fallbackCopy(text){
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    } catch(e) { /* silent */ }
  }

  /* ===== screen transitions ===== */
  const initial = document.getElementById('initial');
  const passcode = document.getElementById('passcode');
  const home = document.getElementById('home');

  function showPasscode(){
    if (passcode.classList.contains('active')) return;
    initial.style.transform = 'translateY(-100%)';
    initial.style.opacity = '0';
    passcode.classList.add('active');
  }

  function unlock(){
    passcode.style.transform = 'translateY(-100%)';
    passcode.style.opacity = '0';
    home.classList.add('active');
  }

  /* ===== swipe-up gesture on initial screen ===== */
  let startY = null;
  initial.addEventListener('touchstart', e => { startY = e.touches[0].clientY; }, {passive:true});
  initial.addEventListener('touchmove', e => {
    if (startY === null) return;
    const dy = startY - e.touches[0].clientY;
    if (dy > 60){ showPasscode(); startY = null; }
  }, {passive:true});
  initial.addEventListener('touchend', () => { startY = null; });

  // desktop fallbacks: wheel up, drag up, or click
  initial.addEventListener('wheel', e => { if (e.deltaY < 0) showPasscode(); }, {passive:true});
  let mDown = null;
  initial.addEventListener('mousedown', e => { mDown = e.clientY; });
  window.addEventListener('mouseup', e => {
    if (mDown !== null && mDown - e.clientY > 50) showPasscode();
    mDown = null;
  });
  initial.addEventListener('click', showPasscode);
</script>

</body>
</html>
